services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /usr/src/app
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev -- -H 0.0.0.0
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_WS_URL: ws://127.0.0.1:8000/ws/telemetry
    depends_on:
      - backend

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    privileged: true  # <--- CRITICAL: Gives container permissions to access host hardware
    group_add:
      - video
    volumes:
      - ./backend:/app
    devices:
      - /dev/video0:/dev/video0 # <--- CRITICAL: Maps the attached video node directly into the container
      - /dev/video1:/dev/video1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
      - "14550:14550/udp"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/drone_db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      DRONE_CONNECTION: udp:0.0.0.0:14550
    depends_on:
      - postgres
      - minio

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: drone_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: